version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "react-router-dom"
          - "@types/react*"
      herramientas-de-build:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vite-plugin-*"
          - "vitest"
          - "@vitest/*"
      calidad:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
          - "prettier"
    ignore:
      # typescript-eslint@8.x fija su peer dep en "typescript >=4.8.4 <6.1.0".
      # Un salto de major en typescript rompe el árbol (ERESOLVE) hasta que
      # typescript-eslint publique soporte. Subir a mano tras comprobarlo.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build"
    ignore:
      # Solo versiones LTS de Node. Las impares nunca lo son, y una par no es
      # LTS hasta octubre del año en que sale. Subir a mano tras comprobarlo.
      - dependency-name: "node"
        versions: [">=25"]
