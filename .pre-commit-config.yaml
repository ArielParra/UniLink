# .pre-commit-config.yaml — UniLink
# Controles de calidad, formato y seguridad ejecutados antes de cada commit.
# Instalación: bash scripts/setup-dev-hooks.sh   ·   Docs: docs/03_CALIDAD_CI.md

default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
minimum_pre_commit_version: "3.5.0"

# Artefactos generados y contenido gestionado por otras herramientas
exclude: |
  (?x)^(
    frontend/node_modules/|
    frontend/dist/|
    frontend/coverage/|
    frontend/src/lib/database\.types\.ts|
    \.agents/skills/|
    \.claude/skills/|
    supabase/\.temp/|
    \.scannerwork/
  )

repos:
  # ─────────────────────────────────────────────────────────────
  # 1. Higiene del repositorio
  # ─────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        name: Validar tamaño de archivos añadidos
        args: ["--maxkb=1024"]
      - id: check-case-conflict
        name: Prevenir conflictos de mayúsculas/minúsculas en nombres
      - id: check-merge-conflict
        name: Detectar marcadores de conflicto sin resolver
      - id: check-yaml
        name: Validar sintaxis YAML
        args: ["--unsafe"]
      - id: check-json
        name: Validar sintaxis JSON
        # Excluidos los que admiten comentarios (JSONC): TypeScript, VSCode y
        # devcontainer los aceptan, pero este hook usa un parser JSON estricto.
        exclude: '(tsconfig.*\.json|\.vscode/.*\.json|\.devcontainer/devcontainer\.json)$'
      - id: end-of-file-fixer
        name: Asegurar salto de línea final
      - id: trailing-whitespace
        name: Limpiar espacios al final de línea
        args: ["--markdown-linebreak-ext=md"]
      - id: mixed-line-ending
        name: Estandarizar finales de línea (LF)
        args: ["--fix=lf"]
      - id: detect-private-key
        name: Detectar llaves privadas
      - id: check-shebang-scripts-are-executable
        name: Asegurar permisos de ejecución en scripts con shebang

  # ─────────────────────────────────────────────────────────────
  # 2. Seguridad — detección de secretos
  # ─────────────────────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks
        name: Escaneo de secretos con Gitleaks

  # ─────────────────────────────────────────────────────────────
  # 3. Scripts de shell
  # ─────────────────────────────────────────────────────────────
  # Los hooks oficiales de ShellCheck y Hadolint se ejecutan dentro de Docker.
  # Bajo podman con SELinux eso reetiqueta el árbol de trabajo y rompe las
  # ejecuciones siguientes, así que aquí se usa el binario del sistema y la
  # validación de Dockerfiles vive en el pipeline (job `seguridad`).
  - repo: local
    hooks:
      - id: shellcheck
        name: Análisis estático de scripts de shell
        entry: bash scripts/lint-shell.sh
        language: system
        files: \.(sh|bash)$

  # ─────────────────────────────────────────────────────────────
  # 4. Frontend — ESLint
  # ─────────────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: frontend-lint
        name: Frontend — ESLint
        entry: bash scripts/lint-frontend.sh
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false

  # ─────────────────────────────────────────────────────────────
  # 5. Coherencia de las instrucciones para agentes
  # ─────────────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: agents-sync
        name: AGENTS.md coincide con la fuente canónica .agents/AGENTS.md
        entry: bash scripts/sync-agents.sh --check
        language: system
        files: ^(AGENTS\.md|\.agents/AGENTS\.md)$
        pass_filenames: false

  # ─────────────────────────────────────────────────────────────
  # 6. Mensajes de commit — Conventional Commits
  # ─────────────────────────────────────────────────────────────
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        name: Validar formato Conventional Commits
        stages: [commit-msg]
        args:
          [
            "feat",
            "fix",
            "docs",
            "style",
            "refactor",
            "perf",
            "test",
            "build",
            "ci",
            "chore",
            "revert",
          ]
