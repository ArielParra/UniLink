# Análisis de calidad — SonarCloud
# El token (SONAR_TOKEN) se inyecta desde los secrets de GitHub Actions.
# Panel: https://sonarcloud.io/project/overview?id=ArielParra_UniLink
# Ver docs/03_CALIDAD_CI.md

sonar.projectKey=ArielParra_UniLink
sonar.organization=arielparra
sonar.projectName=UniLink
sonar.projectVersion=0.1.0

sonar.sourceEncoding=UTF-8

# --- Alcance del análisis ---
sonar.sources=frontend/src
sonar.tests=frontend/src
# La convención del proyecto es .test.ts(x) — ver docs/02_CONVENCIONES.md
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,frontend/src/lib/database.types.ts

# --- Cobertura ---
# El job `calidad` genera el informe LCOV y lo publica como artefacto.
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.tsconfigPath=frontend/tsconfig.json

# --- Exclusiones de duplicación ---
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,supabase/migrations/**
